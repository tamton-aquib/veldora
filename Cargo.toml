[package]
name = "veldora"
description = "A command-line program to bruteforce zips, pdfs and some popular hashes."
homepage = "https://github.com/tamton-aquib/veldora"
repository = "https://github.com/tamton-aquib/veldora"
documentation = "https://docs.rs/veldora"
version = "0.3.0"
authors = ["tamton-aquib <aquibjavedt007@gmail.com>"]
license = "MIT"
edition = "2018"
keywords = ["bruteforce", "dictionary", "zip", "pdf", "hash"]

[dependencies]
digest = "0.10.3"
md-5 = "0.10.1"
sha-1 = "0.10"
sha2 = "0.10.2"
pdf = "0.7.2"
indicatif = "0.17.0"
colored = "2.0"
tiger = "0.2"
rayon = "1.8.1"
memmap2 = "0.9"
flate2 = "1.0"

[profile.optimized]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
